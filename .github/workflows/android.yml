name: Build MyGarage APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate offline app JavaScript and required features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", html)
          if not match:
              raise SystemExit("App JavaScript block not found")
          Path("/tmp/app.js").write_text(match.group(1), encoding="utf-8")
          required = ["function importData", "function exportData", "function showRecords", "function parseJ", "function status", "const KEY='mygarage_service_book_v3'"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing app features: " + ", ".join(missing))
          if "android.permission.INTERNET" in Path("app/src/main/AndroidManifest.xml").read_text():
              raise SystemExit("Offline app must not request internet permission")
          PY
          node --check /tmp/app.js
          node tests/smoke.js
      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build installable debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK package, signature and size
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='ir.ef3.mygarage'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK_SIZE_BYTES=$SIZE"
          if [ "$SIZE" -lt 150000 ]; then
            echo "APK is unexpectedly small ($SIZE bytes); refusing to publish."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyGarage-v3.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0