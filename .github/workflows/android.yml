name: Build MyGarage APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      MYGARAGE_KEYSTORE_BASE64: ${{ secrets.MYGARAGE_KEYSTORE_BASE64 }}
      MYGARAGE_KEYSTORE_PASSWORD: ${{ secrets.MYGARAGE_KEYSTORE_PASSWORD }}
      MYGARAGE_KEY_ALIAS: ${{ secrets.MYGARAGE_KEY_ALIAS }}
      MYGARAGE_KEY_PASSWORD: ${{ secrets.MYGARAGE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate offline app JavaScript and required features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          matches = re.findall(r'<script(?: id="([^"]+)")?>([\s\S]*?)</script>', html)
          scripts = [source for script_id, source in matches if script_id != "mygarage-number-polish"]
          if not scripts:
              raise SystemExit("App JavaScript blocks not found")
          Path("/tmp/app.js").write_text("\n".join(scripts), encoding="utf-8")
          required = ["function importData", "function exportData", "function showRecords", "function parseJ", "function status", "function showCostReport", "function toggleTheme", "function requestImport", "function restoreBackupText", "function showJalaliCalendar", "function closeJalaliCalendar", "function dueInfoHtml", "function toggleDrawer", "function driveSync", "function driveRestore", "function autoTextDirection", "تنظیمات سرویس", "search-clear", "home-toolbar", "add-service-button", "function addService", "#E2E2EE", "mygarage-v35-floating-navbar", "service-history-label", "status-heading status-", "تعمیر و تعویض و بررسی", "const KEY='mygarage_service_book_v3'"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing app features: " + ", ".join(missing))
          if "android.permission.INTERNET" in Path("app/src/main/AndroidManifest.xml").read_text():
              raise SystemExit("Offline app must not request internet permission")
          PY
          node --check /tmp/app.js
          node tests/smoke.js
      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Prepare stable release signing key
        if: ${{ env.MYGARAGE_KEYSTORE_BASE64 != '' && env.MYGARAGE_KEYSTORE_PASSWORD != '' && env.MYGARAGE_KEY_ALIAS != '' && env.MYGARAGE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$MYGARAGE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mygarage-release.jks"
          {
            echo "MYGARAGE_KEYSTORE_PATH=$RUNNER_TEMP/mygarage-release.jks"
            echo "MYGARAGE_KEYSTORE_PASSWORD=$MYGARAGE_KEYSTORE_PASSWORD"
            echo "MYGARAGE_KEY_ALIAS=$MYGARAGE_KEY_ALIAS"
            echo "MYGARAGE_KEY_PASSWORD=$MYGARAGE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MYGARAGE_KEYSTORE_PATH:-}" ]; then
            gradle --no-daemon clean :app:assembleRelease
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Stable signing secrets are not configured. This debug APK may not update an existing installation signed with another key."
            gradle --no-daemon clean :app:assembleDebug
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Verify APK package, signature and size
        shell: bash
        run: |
          set -euo pipefail
          APK="$APK_PATH"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='ir.ef3.mygarage'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK_SIZE_BYTES=$SIZE"
          if [ "$SIZE" -lt 150000 ]; then
            echo "APK is unexpectedly small ($SIZE bytes); refusing to publish."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyGarage-v3.5.0-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0