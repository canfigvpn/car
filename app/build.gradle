plugins { id 'com.android.application' }

android {
    namespace 'ir.alirezaivaz.mygarage'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.ef3.mygarage'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '3.6.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def keyStorePath = System.getenv("MYGARAGE_KEYSTORE_PATH")
            if (keyStorePath) {
                storeFile file(keyStorePath)
                storePassword System.getenv("MYGARAGE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MYGARAGE_KEY_ALIAS")
                keyPassword System.getenv("MYGARAGE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (System.getenv("MYGARAGE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}